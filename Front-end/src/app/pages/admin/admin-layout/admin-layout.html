<div class="flex h-screen bg-base-200">
  <aside class="w-64 bg-base-100 shadow-xl flex flex-col border-r border-base-300">
    <div class="p-6 text-2xl font-bold text-primary flex items-center gap-2">
      <span class="text-3xl">⚙️</span> Admin Panel
    </div>

    <nav class="flex-1 px-4 space-y-2">
      <a routerLink="/admin/dashboard" routerLinkActive="active"
         class="btn btn-ghost justify-start w-full gap-3">
        📊 Dashboard
      </a>

      <a routerLink="/admin/products" routerLinkActive="active"
         class="btn btn-ghost justify-start w-full gap-3">
        📦 Products Management
      </a>

      <a routerLink="/admin/users" routerLinkActive="active"
         class="btn btn-ghost justify-start w-full gap-3">
        👥 Users List
      </a>
    </nav>

    <div class="p-4 border-t border-base-300">
      <button (click)="onLogout()" class="btn btn-error btn-outline w-full gap-2">
        Logout
      </button>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto p-8">
    <router-outlet></router-outlet>
  </main>
</div>

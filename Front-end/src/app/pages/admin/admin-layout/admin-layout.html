<div class="flex min-h-[calc(100vh-72px)] app-page-bg font-sans">
  <aside class="w-72 bg-[#1a2734] shadow-2xl flex flex-col border-r border-yellow-500/10 min-h-[calc(100vh-72px)]">
    <div
      class="p-6 text-2xl font-black text-white flex items-center gap-3 border-b border-yellow-500/10"
    >
      <span
        class="w-2 h-8 bg-yellow-400 rounded-full shadow-[0_0_12px_rgba(250,204,21,0.5)]"
      ></span>
      <span>Admin Panel</span>
    </div>

    <nav class="flex-1 p-4 space-y-2">
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="bg-yellow-400 text-black border-yellow-400"
        class="flex items-center justify-start w-full gap-3 px-4 py-3 rounded-xl border border-yellow-400/20 bg-yellow-400/10 text-yellow-300 hover:bg-yellow-400 hover:text-black transition-all font-bold text-sm"
      >
        Dashboard
      </a>

      <a
        routerLink="/admin/products"
        routerLinkActive="bg-yellow-400 text-black border-yellow-400"
        class="flex items-center justify-start w-full gap-3 px-4 py-3 rounded-xl border border-yellow-400/20 bg-yellow-400/10 text-yellow-300 hover:bg-yellow-400 hover:text-black transition-all font-bold text-sm"
      >
        Products Management
      </a>

      <a
        routerLink="/admin/users"
        routerLinkActive="bg-yellow-400 text-black border-yellow-400"
        class="flex items-center justify-start w-full gap-3 px-4 py-3 rounded-xl border border-yellow-400/20 bg-yellow-400/10 text-yellow-300 hover:bg-yellow-400 hover:text-black transition-all font-bold text-sm"
      >
        Users List
      </a>

      <a
        routerLink="/home"
        routerLinkActive="bg-yellow-400 text-black border-yellow-400"
        class="app-btn app-btn-neutral w-full !justify-start !px-4 !py-3 !text-sm"
      >
        Go to Home
      </a>
    </nav>

    <div class="p-4 border-t border-yellow-500/10">
      <button
        (click)="onLogout()"
        class="w-full px-4 py-3 rounded-xl border border-red-500/30 bg-red-500/10 text-red-300 hover:bg-red-500 hover:text-white transition-all font-bold text-sm"
      >
        Logout
      </button>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto">
    <div class="max-w-7xl mx-auto p-6 md:p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

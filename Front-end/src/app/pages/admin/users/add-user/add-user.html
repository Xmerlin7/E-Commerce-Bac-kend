<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-4">
  <div class="form-control">
    <label class="label"><span class="label-text font-semibold">Full Name</span></label>
    <input type="text" formControlName="name" placeholder="Enter name"
           class="input input-bordered w-full"
           [class.input-error]="userForm.get('name')?.invalid && userForm.get('name')?.touched" />
  </div>

  <div class="form-control">
    <label class="label"><span class="label-text font-semibold">Email Address</span></label>
    <input type="email" formControlName="email" placeholder="email@example.com"
           class="input input-bordered w-full"
           [class.input-error]="userForm.get('email')?.invalid && userForm.get('email')?.touched" />
  </div>

  <div class="form-control">
    <label class="label"><span class="label-text font-semibold">Password</span></label>
    <input type="password" formControlName="password" placeholder="••••••"
           class="input input-bordered w-full"
           [class.input-error]="userForm.get('password')?.invalid && userForm.get('password')?.touched" />
  </div>

  <div class="form-control">
    <label class="label"><span class="label-text font-semibold">User Role</span></label>
    <select formControlName="role" class="select select-bordered w-full">
      <option value="user">User / Customer</option>
      <option value="admin">Admin</option>
    </select>
  </div>

  <div class="mt-6">
    <button type="submit" [disabled]="userForm.invalid"
            class="btn btn-primary w-full shadow-lg">
      Create User
    </button>
  </div>
</form>

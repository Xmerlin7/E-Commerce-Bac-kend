<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-4 p-4">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-bold">Edit Product</h2>
    <a routerLink="/admin/products" class="btn btn-ghost btn-sm">Back</a>
  </div>

  @if (errorMessage()) {
    <div class="alert alert-error shadow-lg w-full">
      <span class="font-semibold">{{ errorMessage() }}</span>
    </div>
  }

  <div class="form-control">
    <label class="label">
      <span class="label-text font-semibold">Product Title</span>
    </label>
    <input
      type="text"
      formControlName="title"
      class="input input-bordered w-full"
      [class.input-error]="productForm.get('title')?.invalid && productForm.get('title')?.touched"
    />
  </div>

  <div class="form-control">
    <label class="label">
      <span class="label-text font-semibold">Description</span>
    </label>
    <textarea
      formControlName="description"
      class="textarea textarea-bordered h-24 w-full"
      [class.textarea-error]="
        productForm.get('description')?.invalid && productForm.get('description')?.touched
      "
    ></textarea>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold">Price</span>
      </label>
      <input
        type="number"
        formControlName="price"
        class="input input-bordered w-full"
        [class.input-error]="productForm.get('price')?.invalid && productForm.get('price')?.touched"
      />
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold">Category (MongoId)</span>
      </label>
      <input
        type="text"
        formControlName="category"
        class="input input-bordered w-full"
        [class.input-error]="
          productForm.get('category')?.invalid && productForm.get('category')?.touched
        "
      />
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold">Availability</span>
      </label>
      <select formControlName="inStock" class="select select-bordered w-full">
        <option value="yes">In Stock</option>
        <option value="no">Out of Stock</option>
      </select>
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold">Product Image URL</span>
      </label>
      <input type="text" formControlName="image" class="input input-bordered w-full" />
    </div>
  </div>

  <div class="mt-6 flex items-center gap-3">
    <button type="submit" [disabled]="productForm.invalid" class="btn btn-primary flex-1 shadow-lg">
      Save Changes
    </button>
    <button type="button" (click)="onDelete()" class="btn btn-error">Delete</button>
  </div>
</form>

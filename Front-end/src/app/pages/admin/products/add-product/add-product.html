<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-4 p-4">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-bold">Add New Product</h2>
    <span class="badge badge-outline">Inventory</span>
  </div>

  <div class="form-control">
    <label class="label">
      <span class="label-text font-semibold">Product Title</span>
    </label>
    <input
      type="text"
      formControlName="title"
      placeholder="e.g. Mechanical Keyboard"
      class="input input-bordered w-full"
      [class.input-error]="productForm.get('title')?.invalid && productForm.get('title')?.touched"
    />
  </div>

  <div class="form-control">
    <label class="label">
      <span class="label-text font-semibold">Description</span>
    </label>
    <textarea
      formControlName="description"
      placeholder="Describe the product features..."
      class="textarea textarea-bordered h-24 w-full"
      [class.textarea-error]="productForm.get('description')?.invalid && productForm.get('description')?.touched"
    ></textarea>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold">Price ($)</span>
      </label>
      <input
        type="number"
        formControlName="price"
        class="input input-bordered w-full"
        [class.input-error]="productForm.get('price')?.invalid && productForm.get('price')?.touched"
      />
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold">Category</span>
      </label>
      <input
        type="text"
        formControlName="category"
        placeholder="Electronics"
        class="input input-bordered w-full"
        [class.input-error]="productForm.get('category')?.invalid && productForm.get('category')?.touched"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold">Availability</span>
      </label>
      <select formControlName="inStock" class="select select-bordered w-full">
        <option value="yes">In Stock</option>
        <option value="no">Out of Stock</option>
      </select>
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold">Product Image URL</span>
      </label>
      <input
        type="text"
        formControlName="image"
        placeholder="https://example.com/image.jpg"
        class="input input-bordered w-full"
      />
    </div>
  </div>

  <div class="mt-6">
    <button type="submit" [disabled]="productForm.invalid" class="btn btn-primary w-full shadow-lg">
      Save Product
    </button>
  </div>
</form>

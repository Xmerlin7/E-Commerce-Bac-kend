<div class="min-h-screen app-page-bg flex items-center justify-center p-6">
  <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
    <div class="text-center lg:text-left">
      <div class="inline-flex items-center gap-3 mb-5">
        <span class="w-2 h-10 bg-yellow-400 rounded-full shadow-[0_0_15px_rgba(250,204,21,0.5)]"></span>
        <h1 class="text-4xl md:text-5xl font-black text-white tracking-tight">تسجيل الدخول</h1>
      </div>
      <p class="text-neutral-300 leading-relaxed">
        أهلاً بيك في <span class="text-yellow-400 font-bold">ShopWave</span>.<br />
        سجل دخولك عشان تكمل التسوق.
      </p>
    </div>

    <div class="bg-[#1c2a37] rounded-3xl border border-white/5 shadow-2xl p-6 md:p-8">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5" dir="ltr">
        <div>
          <label class="block text-sm text-neutral-300 mb-2 font-bold">Email</label>
          <input
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            class="w-full px-4 py-3 rounded-xl bg-[#111827] border border-white/10 text-white placeholder:text-neutral-500 focus:outline-none focus:border-yellow-400/50"
            required
          />
        </div>

        <div>
          <label class="block text-sm text-neutral-300 mb-2 font-bold">Password</label>
          <input
            type="password"
            formControlName="password"
            placeholder="********"
            class="w-full px-4 py-3 rounded-xl bg-[#111827] border border-white/10 text-white placeholder:text-neutral-500 focus:outline-none focus:border-yellow-400/50"
            required
          />
          <div class="mt-2 text-right">
            <a routerLink="/register" class="text-[11px] text-yellow-300 hover:text-yellow-400 font-bold">
              Don't have an account? Register
            </a>
          </div>
        </div>

        @if (conflictMessage()) {
          <div class="p-4 rounded-2xl border border-yellow-500/30 bg-yellow-500/10 text-yellow-200 flex flex-col gap-3">
            <span class="font-semibold text-sm">{{ conflictMessage() }}</span>
            <button
              type="button"
              class="app-btn app-btn-primary !px-4 !py-2 !text-xs w-fit"
              (click)="onSubmit(true)"
            >
              Force Login Here
            </button>
          </div>
        }

        @if (errorMessage()) {
          <div class="p-4 rounded-2xl border border-red-500/20 bg-red-500/10 text-red-200 font-semibold text-sm">
            {{ errorMessage() }}
          </div>
        }

        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full app-btn app-btn-primary disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Login
        </button>
      </form>
    </div>
  </div>
</div>

<div class="hero min-h-screen bg-base-200">
  <div class="hero-content flex-col lg:flex-row-reverse">
    <div class="text-center lg:text-left">
      <h1 class="text-5xl font-bold text-primary">Login now! 🌊</h1>
      <p class="py-6">أهلاً بيك في ShopWave. سجل دخولك عشان تبدأ تدير منتجاتك كـ Team Leader جامد.</p>
    </div>
    <div class="card shrink-0 w-full max-w-sm shadow-2xl bg-base-100">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="card-body">
        
        <div class="form-control">
          <label class="label"><span class="label-text">Email</span></label>
          <input type="email" formControlName="email" placeholder="email" class="input input-bordered" required />
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text">Password</span></label>
          <input type="password" formControlName="password" placeholder="password" class="input input-bordered" required />
          <label class="label">
            <a href="#" class="label-text-alt link link-hover">Forgot password?</a>
          </label>
        </div>

        <div class="form-control mt-6">
          <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary">Login</button>
        </div>

      </form>
    </div>
  </div>
</div>

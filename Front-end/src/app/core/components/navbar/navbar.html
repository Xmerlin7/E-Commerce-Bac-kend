<div class="navbar bg-base-100 shadow-md px-8">
  <div class="flex-1">
    <a routerLink="/" class="btn btn-ghost text-xl font-bold text-primary"> ShopWave 🌊 </a>
  </div>

  <div class="flex-none">
    <ul class="menu menu-horizontal px-1 gap-4 items-center">
      <li><a routerLink="/home" routerLinkActive="active" class="font-medium">Home</a></li>
      <li><a routerLink="/products" routerLinkActive="active" class="font-medium">Products</a></li>

      @if (!authService.currentUser()) {
        <li><a routerLink="/login" class="btn btn-outline btn-primary btn-sm px-6">Login</a></li>
        <li>
          <a routerLink="/register" class="btn btn-outline btn-accent btn-sm px-6">Register</a>
        </li>
      }
      @if (authService.currentUser()) {
        <li>
          <button (click)="onLogoutClick()" class="btn btn-error btn-sm text-white">Logout</button>
        </li>
        <li class="text-primary font-bold">Welcome, {{ authService.currentUser()?.name }}</li>
      }
    </ul>
  </div>
</div>
